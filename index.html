addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;if(e.key=='Delete'||e.key=='Backspace'){comps=comps.filter(c=>!sel.has(c.id));wires=wires.filter(w=>w.id!=selW&&get(w.a.split('.')[0])&&get(w.b.split('.')[0]));sel.clear();selW=null;ui()}if(e.key=='r'||e.key=='R'){sel.forEach(i=>{const c=get(i);c.rot=(c.rot+1)%4});ui()}});
svg.addEventListener('dragover',e=>e.preventDefault());svg.addEventListener('drop',e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(D[t]){const p=toW(e);const c=add(t,sn(p.x-40),sn(p.y-40));gsap.from(c,{glow:0});sel.clear();sel.add(c.id);ui()}});

ORDER.forEach(([h,l])=>{$('#lib').insertAdjacentHTML('beforeend',`<h4>${h}</h4>`);l.forEach(t=>{const d=D[t],e=document.createElement('div');e.className='lib';e.draggable=true;e.innerHTML=`<svg width="28" height="28" style="flex:none"><rect x="3" y="3" width="22" height="22" fill="${d.c}33" stroke="${d.c}"/>${d.pins.slice(0,4).map((p,i)=>`<circle cx="3" cy="${7+i*6}" r="1.8" fill="${K[p.k]}"/>`).join('')}</svg><div><b>${d.n}</b><small>${d.desc}</small><small>${d.pins.length} pins · ${d.pr}</small></div>`;e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',t);e.onclick=()=>{const c=add(t,sn(-view.x/view.k+200),sn(-view.y/view.k+100));sel.clear();sel.add(c.id);ui()};$('#lib').appendChild(e)})});

MET.forEach(m=>$('#gm').insertAdjacentHTML('beforeend',`<option value="${m[0]}">${m[1]}</option>`));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));['ser','code','dash','gw'].forEach(i=>$('#'+i).style.display=i==b.dataset.t?(i=='dash'?'flex':'block'):'none');drawG()});
$('#bRun').onclick=runSim;$('#bPause').onclick=()=>{if(sim.st=='RUNNING'){sim.st='PAUSED';ui()}};$('#bReset').onclick=reset;$('#bOrtho').onclick=e=>{ortho=!ortho;e.target.textContent='WIRES: '+(ortho?'ORTHO':'STRAIGHT');render()};

// ---- toolbar extras: speed, mode, presets, network, sensor reset
['0.5','1','2','5'].forEach(s=>{const b=document.createElement('button');b.textContent=s+'×';if(s=='1')b.className='on';b.onclick=()=>{sim.speed=+s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x==b))};$('#spd').appendChild(b)});
[['circuit','Circuit'],['flow','Data flow'],['ai','AI pipeline']].forEach(([m,n])=>{const b=document.createElement('button');b.textContent=n;if(m=='circuit')b.className='on';b.onclick=()=>{mode=m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x==b));render();ovl()};$('#modes').appendChild(b)});
function preset(n){reset();comps=[];wires=[];sel.clear();selW=null;selPk=null;uid=1;manual=false;
const u=add('uno',300,90),mk=[['sps30',30,20],['scd41',30,170],['bme688',30,320]];if(n>=2)mk.push(['mics',30,470]);if(n>=3)mk.push(['oled',800,40],['relay',800,190],['fan',970,210]);
const cs2=mk.map(m=>add(m[0],m[1],m[2]));cs2.forEach(c=>suggest(c).forEach(([a,b])=>connect(a,b,true)));

view={x:30,y:20,k:.8};log('Preset '+n+' loaded');ui()}
